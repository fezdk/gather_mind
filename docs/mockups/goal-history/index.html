<!doctype html>
<html lang="da">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gather Mind · Goal history concepts</title>
<style>
:root{--ink:#25322f;--muted:#55605b;--paper:#f7f3ea;--card:#fffdf8;--green:#416555;--pale:#dfe9df;--line:#dedfd7}*{box-sizing:border-box}body{margin:0;background:#e9e9e2;color:var(--ink);font:15px/1.45 Arial,sans-serif}button,summary{font:inherit;color:inherit;cursor:pointer}button{border:0;background:none;min-height:48px}button:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:2px}button:disabled{cursor:default;color:#858983}svg{display:block;flex-shrink:0}h1,h2,h3,p{margin:0}.board{max-width:1300px;margin:auto;padding:32px 28px 38px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}.intro h1{font:34px Georgia,serif;letter-spacing:-1px}.intro p{color:var(--muted);margin-top:8px}.prototype-tag{font-size:12px;border:1px solid #a5b3a8;border-radius:30px;padding:8px 14px;white-space:nowrap}.concepts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.label{display:flex;align-items:center;gap:10px;margin-bottom:12px}.letter{display:grid;place-items:center;border-radius:50%;width:30px;height:30px;background:var(--green);color:white;font-size:13px;font-weight:bold}.label h2{font-size:18px}.caption{font-size:14px;color:var(--muted);padding:14px 4px 0;line-height:1.6}.phone{height:870px;border:1px solid #c5c8bf;border-radius:30px;overflow:hidden;background:var(--paper);box-shadow:0 10px 28px #25322f0a;display:flex;flex-direction:column}.status{height:31px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;font-weight:bold}.brand{height:56px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700}.brand .settings{margin-left:auto;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}.scroll{flex:1;overflow:auto;scrollbar-width:none;padding:0 18px 22px}.back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--green);padding:0}.page-title{font:600 32px/1.2 Georgia,serif;letter-spacing:-.8px}.readonly{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin:8px 0 18px}.segmented{display:flex;border-radius:13px;border:1px solid var(--line);padding:3px;gap:3px;margin-bottom:7px;background:var(--card)}.segmented button{flex:1;min-height:42px;border-radius:10px;font-size:13px;font-weight:bold}.segmented [aria-pressed=true]{background:var(--pale);color:var(--green)}.period{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:bold}.period button{width:48px;display:grid;place-items:center}.weekdays,.calendar,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.weekdays{font-size:10px;text-align:center;color:var(--muted);padding:2px 0 6px}.day{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:3px 0;border-radius:12px;min-height:52px}.day[aria-pressed=true]{background:var(--pale);outline:1.5px solid var(--green);outline-offset:-2px}.ring{width:34px;height:34px;position:relative;display:grid;place-items:center;font-size:12px}.ring svg{position:absolute;inset:0}.ring span{position:relative}.ring.selected{font-weight:bold}.future .ring{color:#838780}.ratio{font-size:9px;color:var(--muted);line-height:1}.legend{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin:11px 0 18px}.legend svg{width:14px;height:14px}.day-heading{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--line);margin-bottom:12px}.day-heading h3{font-size:17px}.day-heading p{font-size:12px;color:var(--muted);margin-top:3px}.badge{background:var(--pale);border-radius:20px;padding:5px 9px;font-size:11px;color:var(--green)}.goal{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:13px;margin-top:8px;display:flex;gap:10px;align-items:flex-start}.goal .mark{margin-top:2px;flex-shrink:0;color:var(--green)}.goal h4{font-size:14px;margin:0;font-weight:600}.goal p{font-size:11px;color:var(--muted);margin-top:3px}.goal.open{background:transparent}.steps{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.steps div{margin:5px 0;display:flex;gap:8px;align-items:center}.steps svg{width:13px;height:13px}.goal-body{flex:1}.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px}.week .day{min-height:85px}.week .weekday{font-size:10px;color:var(--muted);margin-bottom:6px}.week .mini-bar{width:25px;height:4px;border-radius:4px;background:var(--line);margin:5px 0}.week .mini-bar span{height:100%;display:block;border-radius:4px;background:var(--green)}.week .date-number{font-size:16px}.week .ratio{font-size:10px}.week + .legend{margin-bottom:24px}.timeline-label{font-size:11px;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin:20px 0 10px;font-weight:bold}.entry{border:1px solid var(--line);border-radius:17px;background:var(--card);margin-top:10px;overflow:hidden}.entry[open]{border-color:#9caf9f}.entry summary{list-style:none;min-height:76px;display:flex;align-items:center;padding:12px;gap:12px}.entry summary::-webkit-details-marker{display:none}.date-tile{background:var(--pale);border-radius:12px;min-width:45px;padding:6px;text-align:center;color:var(--green);font-size:10px}.date-tile strong{font:23px Georgia,serif;display:block}.entry-copy{flex:1}.entry-copy strong{font-size:14px}.entry-copy small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.small-bar{display:inline-block;width:42px;height:4px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}.small-bar i{display:block;height:100%;background:var(--green)}.disclose{transition:transform .15s}.entry[open] .disclose{transform:rotate(180deg)}.entry-content{padding:0 12px 13px}.entry-content .goal{border:none;border-top:1px solid var(--line);border-radius:0;padding:11px 0;margin:0}.tabs{height:70px;flex-shrink:0;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;background:var(--paper)}.tab{width:25%;font-size:9px;text-align:center;color:var(--muted)}.tab .icon{display:grid;place-items:center;margin:auto auto 4px;width:44px;height:27px;border-radius:20px}.tab.active .icon{background:var(--pale);color:var(--green)}.tab.active{font-weight:bold;color:var(--green)}.system-nav{height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:space-around;font-size:13px;color:var(--muted);background:var(--paper)}.empty{padding:20px 14px;border:1px dashed #aeb8ac;border-radius:14px;margin-top:10px;font-size:14px}.empty p{font-size:12px;color:var(--muted);margin-top:5px}.entry-point{margin-top:25px;padding-top:17px;border-top:1px solid #cbd1c6;font-size:13px;color:var(--muted)}.entry-point strong{color:var(--ink)}.only .board{padding:0;width:390px}.only .intro,.only .label,.only .caption,.only .entry-point{display:none}.only .concepts{display:block}.only .concept{display:none}.only .concept.chosen{display:block}.only .phone{border:0;border-radius:0;height:844px;box-shadow:none}.only{background:var(--paper)}@media(max-width:900px){.concepts{grid-template-columns:1fr}.concept{max-width:390px;width:100%;margin:auto}.intro{display:block}.prototype-tag{display:inline-block;margin-top:15px}.phone{height:844px}.board{padding:24px 16px}.only .board{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="board">
 <header class="intro"><div><h1>Et tilbageblik på dine goals</h1><p>Tre UI-retninger · samme eksempel: onsdag den 16. september · 4 af 5 afsluttet</p></div><span class="prototype-tag">DESIGNMOCK · KUN EKSEMPELDATA</span></header>
 <main class="concepts" id="concepts"></main>
 <p class="entry-point"><strong>Fælles indgang:</strong> “History” ved goal-listen på Today → “Previous days”. Ingen ny bundfane. Ingen redigering, swipe eller genåbning af goals.</p>
</div>
<script>
const paths={back:'m14 6-6 6 6 6',next:'m10 6 6 6-6 6',down:'m6 9 6 6 6-6',check:'m5 12 4 4 10-10',minus:'M6 12h12',home:'m3 11 9-8 9 8M5 10v11h14V10M10 21v-7h4v7',calendar:'M5 5h14v15H5zM5 10h14M8 3v4M16 3v4',thought:'M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z',heart:'M12 20 3 11a5 5 0 0 1 9-6 5 5 0 0 1 9 6Z',lock:'M6 10h12v11H6zM8 10V6a4 4 0 0 1 8 0v4',settings:'M4 7h16M4 17h16M9 4v6M15 14v6'};
const icon=(name,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]}"/></svg>`;
const sample={1:[3,4],2:[4,4],3:[2,5],4:[3,3],5:[0,0],6:[1,2],7:[4,5],8:[3,4],9:[2,4],10:[4,4],11:[3,5],12:[2,3],13:null,14:[3,5],15:[5,5],16:[4,5]};
const titles=['Morning routine','A little fresh air','Call the dentist','Prepare for tomorrow','Sort the paperwork'];
const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dateName=d=>new Date(2026,8,d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const circle=(d,chosen)=>{const data=sample[d],ratio=data&&data[1]?data[0]/data[1]:0;return `<span class="ring ${chosen?'selected':''}">${data&&data[1]?`<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="2.3"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--green)" stroke-width="2.3" stroke-dasharray="${ratio*94.25} 94.25" transform="rotate(-90 18 18)" stroke-linecap="round"/></svg>`:''}<span>${d}</span></span>`};
function goals(d,expanded=false){const data=sample[d];if(!data)return '<div class="empty">No saved history<p>This date has no record. It does not mean nothing was completed.</p></div>';if(!data[1])return '<div class="empty">No goals planned<p>There was no goal list for this day.</p></div>';return Array.from({length:data[1]},(_,i)=>{const done=i<data[0];return `<article class="goal ${done?'':'open'}"><span class="mark">${icon(done?'check':'minus',19)}</span><div class="goal-body"><h4>${titles[i]}</h4><p>${done?'Completed':'Still open at the end of the day'}${i===0?' · Daily':''}</p>${i===0?expanded?'<div class="steps"><div>'+icon('check')+'Have breakfast</div><div>'+icon('check')+'Take vitamins</div><div>'+icon('check')+'Get dressed</div></div>':'<p>3 of 3 steps completed</p>':''}</div></article>`}).join('')}
function detail(d,expanded=false){const data=sample[d];return `<section aria-live="polite"><div class="day-heading"><div><h3>${dateName(d)}</h3><p>${data?data[1]?`${data[0]} of ${data[1]} completed`:'No goals planned':'No saved history'}</p></div><span class="badge">View only</span></div>${goals(d,expanded)}<p class="note">A snapshot of this day. Later changes to your routines do not change this record.</p></section>`}
function calendar(selected){let html='<div class="weekdays">'+['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')+'</div><div class="calendar"><span></span>';for(let d=1;d<=30;d++){const data=sample[d];html+=`<button class="day ${d>16?'future':''}" ${d>16?'disabled':''} data-day="${d}" aria-pressed="${selected===d}" aria-label="${dateName(d)}, ${data?data[1]?`${data[0]} of ${data[1]} completed`:'no goals planned':d>16?'history not yet available':'no saved history'}">${circle(d,selected===d)}<span class="ratio">${d>16?'&nbsp;':data?data[1]?data.join('/'):'·':'—'}</span></button>`}return html+'</div><div class="legend">'+icon('check',14)+'Completed / planned <span style="margin-left:auto">· No goals &nbsp; — No record</span></div>'}
function week(selected,start){return '<div class="week">'+Array.from({length:7},(_,i)=>{const d=start+i,data=sample[d];return `<button class="day" ${d>16?'disabled':''} data-day="${d}" aria-pressed="${selected===d}" aria-label="${dateName(d)}, ${data?data[1]?`${data[0]} of ${data[1]} completed`:'no goals planned':'no saved history'}"><span class="weekday">${['M','T','W','T','F','S','S'][i]}</span><span class="date-number">${new Date(2026,8,d).getDate()}</span><span class="mini-bar"><span style="width:${data&&data[1]?100*data[0]/data[1]:0}%"></span></span><span class="ratio">${d>16?'':data?data[1]?data.join('/'):'·':'—'}</span></button>`}).join('')+'</div><div class="legend">Completed / planned <span style="margin-left:auto">· No goals &nbsp; — No record</span></div>'}
function timeline(){return '<p class="timeline-label">September 2026</p>'+[16,15,14,13,12,11].map(d=>{const data=sample[d];return `<details class="entry" ${d===16?'open':''}><summary><span class="date-tile">SEP<strong>${d}</strong></span><span class="entry-copy"><strong>${names[new Date(2026,8,d).getDay()]}</strong><small>${data?`<span class="small-bar"><i style="width:${data[0]/data[1]*100}%"></i></span>${data[0]} of ${data[1]} completed`:'No saved history'}</small></span><span class="disclose">${icon('down',18)}</span></summary><div class="entry-content">${goals(d)}</div></details>`}).join('')}
const nav=`<div class="tabs" aria-label="Static navigation preview">${[['home','Today'],['calendar','Appointments'],['thought','Thoughts'],['heart','Health']].map(([i,t],n)=>`<div class="tab ${n===0?'active':''}"><span class="icon">${icon(i,21)}</span>${t}</div>`).join('')}</div><div class="system-nav" aria-hidden="true"><span>Ⅲ</span><span>○</span><span>‹</span></div>`;
const concepts=[['month','A','Måned · overblikket','Find en dato eller få overblik over måneden. Dagen åbnes nedenunder; kalenderen tager mest plads.'],['week','B','Uge · mere plads til dagen','En lille datostribe giver mere plads til goals og underpunkter. Månedsknappen giver hurtige spring.'],['journal','C','Dagbog · uden kalender','Scroll tilbage i dagene, og fold dem ud. Mindst kalender-UI; bedst til de seneste dage.']];
for(const [type,letter,title,caption] of concepts){const section=document.createElement('section');section.className='concept';section.id=type;section.innerHTML=`<div class="label"><span class="letter">${letter}</span><h2>${title}</h2></div><div class="phone"><div class="status"><span>9:41</span><span>▴ ▴ ▰</span></div><div class="brand"><svg width="28" height="28" viewBox="0 0 30 30" fill="none" stroke="var(--green)" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="8"/><circle cx="21" cy="14" r="7"/><circle cx="15" cy="21" r="8" fill="var(--paper)"/></svg>Gather Mind<span class="settings">${icon('settings',19)}</span></div><div class="scroll"><button class="back" title="Illustrative return control">${icon('back',17)}Today</button><h2 class="page-title">Previous days</h2><p class="readonly">${icon('lock',13)}Goal history · view only</p><div class="view-content"></div></div>${nav}</div><p class="caption">${caption}</p>`;document.getElementById('concepts').append(section);if(type==='journal'){section.querySelector('.view-content').innerHTML=timeline();continue}let mode=type,selected=16,start=14;const content=section.querySelector('.view-content');function render(){content.innerHTML=`<div class="segmented" aria-label="Calendar view"><button data-mode="week" aria-pressed="${mode==='week'}">Week</button><button data-mode="month" aria-pressed="${mode==='month'}">Month</button></div><div class="period"><button data-shift="-1" aria-label="Previous week" ${mode==='month'||start===0?'disabled':''}>${icon('back')}</button><span>${mode==='month'?'September 2026':start===0?'31 August – 6 September':`${start}–${start+6} September`}</span><button data-shift="1" aria-label="Next week" ${mode==='month'||start===14?'disabled':''}>${icon('next')}</button></div>${mode==='month'?calendar(selected):week(selected,start)}${detail(selected,mode==='week')}`;content.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.day);start=selected-((new Date(2026,8,selected).getDay()+6)%7);render()}));content.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;render()}));content.querySelectorAll('[data-shift]').forEach(b=>b.addEventListener('click',()=>{start+=Number(b.dataset.shift)*7;selected=start;render()}))}render()}
document.querySelectorAll('.entry').forEach(entry=>entry.addEventListener('toggle',()=>{if(entry.open)for(const other of document.querySelectorAll('.entry'))if(other!==entry)other.open=false}));
document.querySelectorAll('.back').forEach(button=>button.addEventListener('click',()=>alert('Mock: return to Today. History would open from the goal section, not a new bottom tab.')));
const requested=new URLSearchParams(location.search).get('view');if(concepts.some(c=>c[0]===requested)){document.body.classList.add('only');document.getElementById(requested).classList.add('chosen')}
</script>
</html>
